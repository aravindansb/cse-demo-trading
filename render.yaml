services:
  - type: web
    name: cse-demo-trading-backend
    env: node
    plan: free
    rootDir: backend
    buildCommand: npm install && npm run render:build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
