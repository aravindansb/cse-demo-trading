version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: cse-backend
    restart: unless-stopped
    environment:
      - PORT=5000
      - NODE_ENV=production
      - JWT_SECRET=cse_production_secret_key_change_me_if_needed
      - DATABASE_URL=file:/app/prisma/dev.db
    volumes:
      - cse_db_data:/app/prisma
    expose:
      - "5000"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: cse-frontend
    restart: unless-stopped
    environment:
      - PORT=3000
      - NODE_ENV=production
    expose:
      - "3000"
    depends_on:
      - backend

  nginx:
    image: nginx:alpine
    container_name: cse-nginx
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - backend
      - frontend

volumes:
  cse_db_data:
